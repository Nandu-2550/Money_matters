<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Outer Shield Outline -->
  <path d="M256 64 L416 128 C416 292 256 420 256 420 C256 420 96 292 96 128 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />
        
  <!-- Inner Shield Core -->
  <path d="M256 94 L386 148 C386 280 256 388 256 388 C256 388 126 280 126 148 Z" 
        fill="#0f172a" />
        
  <!-- Indian Rupee (₹) Symbol in Brilliant Gold/Cyan -->
  <!-- Top horizontal line 1 -->
  <rect x="190" y="172" width="132" height="22" rx="11" fill="#34d399" />
  <!-- Top horizontal line 2 -->
  <rect x="190" y="212" width="132" height="22" rx="11" fill="#34d399" />
  <!-- Rupee upper curve & stem -->
  <path d="M236 172 V310" stroke="#34d399" stroke-width="22" stroke-linecap="round" />
  <path d="M236 172 C300 172 300 252 236 252" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" />
  <!-- Downward right slant stroke -->
  <path d="M228 252 L310 338" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" />
  
  <!-- Little Lock / Security Check icon accent -->
  <circle cx="340" cy="340" r="42" fill="#10b981" stroke="#0f172a" stroke-width="8" />
  <path d="M328 340 L336 348 L354 330" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
